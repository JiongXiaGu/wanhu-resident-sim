name: Resident Visual Review

on:
  push:
    branches: [main, 'tmp-*']
    paths:
      - 'Web/**'
      - 'Content/**'
      - 'Tools/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/visual-review.yml'
      - 'Documentation/**'
      - 'AGENTS.md'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: resident-visual-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retain editable source with review artifacts
        run: |
          mkdir -p review-screenshots/avatar
          git rev-parse HEAD > review-screenshots/avatar/source-commit.txt
          git archive --format=zip --output=review-screenshots/avatar/source-and-contract.zip HEAD Web/src/avatar Web/src/App.tsx Web/src/resident/ResidentAvatar.tsx Web/src/main.tsx scripts Documentation AGENTS.md README.md .github/workflows/visual-review.yml
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Install app dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install screenshot packages
        run: npm install --no-save --prefer-offline --no-audit --no-fund playwright@1.55.0 sharp@0.34.3
      - name: Install Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Build generated content
        run: npm run build-content
      - name: Start Vite review server
        run: |
          npm run dev -w Web -- --host 127.0.0.1 --port 4173 > /tmp/wanhu-resident-vite.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wanhu-resident-vite.log
          exit 1
      - name: Review resident life and story continuity
        run: node scripts/capture-resident-review.mjs
      - name: Review frozen portrait frame contract
        run: node scripts/capture-portrait-review.mjs
      - name: Review avatar editing, object saves and modular artwork
        run: |
          node scripts/capture-avatar-review.mjs
          node scripts/review-avatar-integration.mjs
          node scripts/capture-avatar-art-polish.mjs
      - name: Review Phase 8A art foundation and six-frame studio
        run: node scripts/capture-avatar-foundation.mjs
      - name: Review Phase 8B child and elder wardrobe
        run: |
          git fetch --no-tags --depth=1 origin 28ad42619edb7a6abb21ca7ef8d2dee30d2afda2
          node scripts/avatar-review/export-age-baseline.mjs
          node scripts/capture-avatar-age-wardrobe.mjs
      - name: Review Phase 8B2 adult wardrobe and collar repairs
        run: |
          git fetch --no-tags --depth=1 origin 59028b3afd4b24c1cc57edbe68ce13b2bd5314f9
          node scripts/avatar-review/export-age-baseline.mjs 59028b3afd4b24c1cc57edbe68ce13b2bd5314f9 review-screenshots/avatar/phase8b2
          node scripts/capture-avatar-adult-wardrobe.mjs
      - name: Review Phase 8D1 assets, descriptions and search
        run: |
          git fetch --no-tags --depth=1 origin 7ba57695c392f14d598e818beadecff877dd52f9
          node scripts/avatar-review/export-age-baseline.mjs 7ba57695c392f14d598e818beadecff877dd52f9 review-screenshots/avatar/phase8d
          node scripts/capture-avatar-theme-assets.mjs
      - name: Compress legacy review previews
        run: node scripts/compress-review-screenshots.mjs
      - name: Upload screenshots and editable components
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-visual-review
          path: review-screenshots/
          if-no-files-found: error
          retention-days: 7
