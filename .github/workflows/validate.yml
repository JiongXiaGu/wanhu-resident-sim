name: Build

on:
  push:
    branches:
      - main
      - 'tmp-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: resident-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Compile resident demo content
        run: npm run build-content
      - name: Upload compiled resident demo data
        uses: actions/upload-artifact@v4
        with:
          name: resident-generated-data
          path: |
            Web/public/generated/stories.json
            Web/public/generated/definitions.json
            Web/public/generated/resident-snapshot.json
          retention-days: 7
          if-no-files-found: error
      - name: Build web prototype
        run: npm run build -w Web
