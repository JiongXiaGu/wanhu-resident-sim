name: Build

on:
  push:
    branches:
      - main
      - 'tmp-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: resident-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Build generated content and web
        run: npm run build
